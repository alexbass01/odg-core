name: Release Client Package
on:
  workflow_dispatch:
    inputs:
      client:
        type: choice
        options:
          - bdba
          - odg

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Update Python Package
    permissions:
      id-token: write
    steps:
      - uses: gardener/cc-utils/.github/actions/trusted-checkout@v1
        with:
          token-server: ${{ vars.FEDERATED_GITHUB_ACCESS_TOKEN_SERVER }}
          github-auth-token-permissions: |
            contents: write
          init-git-identity: true
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Bump to release version and build
        id: version
        shell: bash
        run: |
          set -euo pipefail

          pkg="packages/${{ inputs.client }}-client"

          # strip .dev0 suffix to get the release version
          current="$(uv version --project ${pkg} | awk '{print $2}')"
          release="${current%.dev0}"

          echo "releasing ${current} => ${release}"
          echo "release-version=${release}" >> "${GITHUB_OUTPUT}"

          uv version --project "${pkg}" "${release}"
          uv build --package "${{ inputs.client }}-client" --out-dir dist

          echo "Built package:"
          ls dist/
      - name: Upload Distribution Package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distribution-package
          path: dist/
      - name: Bump to next dev version and commit
        shell: bash
        run: |
          set -euo pipefail

          pkg="packages/${{ inputs.client }}-client"
          release="${{ steps.version.outputs.release-version }}"

          # bump minor and add .dev0
          next="$(uv run --no-project --with semver python3 -c "
          import semver
          v = semver.Version.parse('${release}')
          print(f'{v.bump_minor()}.dev0')
          ")"

          echo "next dev version: ${next}"
          uv version --project "${pkg}" "${next}"

          git add "${pkg}/pyproject.toml" uv.lock
          git commit -m "Upgrade ${{ inputs.client }} client" -m "from ${release} to ${next}"
          git push

  pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs:
      - build
    permissions:
      id-token: write
    steps:
      - name: Retrieve Distribution Package
        uses: actions/download-artifact@v8.0.1
        with:
          name: distribution-package
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # assumes package to be located in `dist/`
