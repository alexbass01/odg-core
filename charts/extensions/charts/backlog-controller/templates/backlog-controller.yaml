{{- $podName := "backlog-controller" }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $podName }}
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $podName }}
  template:
    metadata:
      labels:
        app: {{ $podName }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      securityContext:
        {{- include "odg.securitycontext.pod" . | nindent 8 }}
      containers:
        - name: {{ $podName }}
          image: {{ include "image" .Values.global.image }}
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - backlog_controller
          securityContext:
            {{- include "odg.securitycontext.container" . | nindent 12 }}
            readOnlyRootFilesystem: true # writable paths: /tmp + /home/odg (home, both emptyDir)
          env:
            - name: SECRET_FACTORY_PATH
              value: /secrets
            - name: EXTENSIONS_CFG_PATH
              value: /extensions_cfg/extensions_cfg
            - name: K8S_TARGET_NAMESPACE
              value: {{ .Values.target_namespace | default .Release.Namespace }}
          volumeMounts:
            - name: kubernetes
              mountPath: /secrets/kubernetes
            - name: extensions-cfg
              mountPath: /extensions_cfg
            - name: github
              mountPath: /secrets/github
            - name: github-app
              mountPath: /secrets/github-app
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/odg
          {{- with (.Values.deployment).resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: kubernetes
          secret:
            secretName: secret-factory-kubernetes
            optional: true # might use incluster config
        - name: extensions-cfg
          configMap:
            name: extensions-cfg
        - name: github
          secret:
            secretName: secret-factory-github
            optional: true
        - name: github-app
          secret:
            secretName: secret-factory-github-app
            optional: true
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: home # logs-*.log (cwd), CACHE_DIR, HOME
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-backlog-controller
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $podName }}
  policyTypes:
    - Egress
  egress:
    - {}  # Allows all egress traffic to any destination and port
