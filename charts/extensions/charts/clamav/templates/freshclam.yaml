{{- $podName := "freshclam" }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $podName }}
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $podName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{ $podName }}
    spec:
      automountServiceAccountToken: false # freshclam does not talk to the k8s api
      securityContext:
        {{- include "odg.securitycontext.pod" . | nindent 8 }}
      containers:
        - name: {{ $podName }}
          image: {{ include "image" .Values.global.image }}
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - freshclam
          securityContext:
            {{- include "odg.securitycontext.container" . | nindent 12 }}
            readOnlyRootFilesystem: true # writable paths -> emptyDir mounts below
          startupProbe:
            httpGet:
              path: /readiness
              port: 8080
            failureThreshold: 12
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          ports:
            - containerPort: 8080
              name: default
          volumeMounts:
            - name: www
              mountPath: /www
            - name: freshclam
              mountPath: /freshclam
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/odg
          {{- with (.Values.freshclam).resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: www # served over http; virus definitions (~150Mi + deltas)
          emptyDir:
            sizeLimit: 1Gi
        - name: freshclam # status + log file
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: home # logs-*.log, HOME
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-freshclam
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $podName }}
  policyTypes:
    - Egress
  egress:
    - {}  # Allows all egress traffic to any destination and port
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-freshclam
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $podName }}
  policyTypes:
    - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
