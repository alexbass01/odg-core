[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["delivery*", "odg_client*"]

[project]
name = "odg-client"
description = "Client library for the Open Delivery Gear"
version = "0.13.0.dev0"
requires-python = ">=3.12"
dependencies = [
    "dacite",
    "gardener-ocm",
    "pycryptodome",
    "pyjwt",
    "requests",
]
